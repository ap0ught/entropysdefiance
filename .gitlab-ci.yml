image: cimg/android:2024.01

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/

stages:
  - build
  - test
  - release

build_apk:
  stage: build
  script:
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
    - cp .secure_files/entropy.keystore $CI_PROJECT_DIR/release.keystore
    - ./gradlew assembleRelease
    - echo "APK built successfully"
    - ls -lh app/build/outputs/apk/release/
  artifacts:
    paths:
      - app/build/outputs/apk/release/app-release.apk
    name: "entropysdefiance-${CI_COMMIT_TAG}"
    expire_in: 1 week

test:
  stage: test
  script:
    - ./gradlew compileDebugKotlin
    - ./gradlew test

upload_package:
  stage: release
  image: curlimages/curl:latest
  needs:
    - job: build_apk
      artifacts: true
  script:
    - |
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" \
           --upload-file app/build/outputs/apk/release/app-release.apk \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/entropysdefiance/${CI_COMMIT_TAG}/app-release.apk"
  only:
    - tags

release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build_apk
      artifacts: true
    - job: upload_package
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: |
      Android APK release for version $CI_COMMIT_TAG
    tag_name: '$CI_COMMIT_TAG'
    assets:
      links:
        - name: 'app-release.apk'
          url: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/entropysdefiance/${CI_COMMIT_TAG}/app-release.apk'
          link_type: 'package'
  only:
    - tags
